name: Standalone release

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve binary and image version
        id: version
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$REF_TYPE" == tag ]]; then
            if [[ ! "$REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
              echo 'Release tags must use vX.Y.Z or vX.Y.Z-prerelease (no build metadata).' >&2
              exit 1
            fi
            echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: cd web && bun install --frozen-lockfile
      - run: make verify
      - run: make integration
      - name: Build standalone binaries
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: make release VERSION="$VERSION"
      - run: cd bin && sha256sum copilot-proxy-* > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-binaries
          path: bin/
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: bin/*

  docker:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Resolve GHCR image name and publication policy
        id: image
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          # PRs and manual runs on non-default branches only build/test, never publish.
          if [[ "$EVENT_NAME" != pull_request && "$REF" == refs/tags/v* ]] || \
             [[ "$EVENT_NAME" == workflow_dispatch && "$REF" == "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: Build local image for Compose smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: copilot-proxy:smoke
          build-args: VERSION=${{ needs.build.outputs.version }}
          cache-from: type=gha,scope=copilot-image
          cache-to: type=gha,mode=max,scope=copilot-image
      - name: Test actual Compose deployment without GitHub credentials
        run: bash scripts/smoke-docker.sh copilot-proxy:smoke
      - name: Image tags and OCI metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=sha,format=long
          labels: |
            org.opencontainers.image.version=${{ needs.build.outputs.version }}
      - name: Log in to GitHub Container Registry
        if: steps.image.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build multi-platform image and publish when allowed
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.image.outputs.publish == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ needs.build.outputs.version }}
          cache-from: type=gha,scope=copilot-image
          cache-to: type=gha,mode=max,scope=copilot-image
          provenance: mode=min
          sbom: true
      - name: Publication summary
        if: steps.image.outputs.publish == 'true'
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.publish.outputs.digest }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo '### GHCR image published'
            printf '\nImage: `%s`\n\nDigest: `%s`\n\n' "$IMAGE_NAME" "$DIGEST"
            printf '%s\n' "$IMAGE_TAGS"
          } >> "$GITHUB_STEP_SUMMARY"
