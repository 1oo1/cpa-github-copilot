name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          path: cpa-github-copilot

      - name: Checkout CLIProxyAPI (replace target)
        uses: actions/checkout@v4
        with:
          repository: router-for-me/CLIProxyAPI
          path: CLIProxyAPI

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cpa-github-copilot/go.mod

      - name: Install cross compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-x86-64-linux-gnu gcc-aarch64-linux-gnu

      - name: Build plugins
        working-directory: cpa-github-copilot
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+(\.[0-9]+)+$ ]]; then
            echo "release tag must use v<dotted-numeric-version>, got $GITHUB_REF_NAME" >&2
            exit 1
          fi
          make build VERSION="${GITHUB_REF_NAME#v}"

      - name: Stage artifacts
        working-directory: cpa-github-copilot
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          zip -j "dist/github-copilot-go_${version}_linux_amd64.zip" \
            bin/linux/amd64/github-copilot-go.so
          zip -j "dist/github-copilot-go_${version}_linux_arm64.zip" \
            bin/linux/arm64/github-copilot-go.so
          (
            cd dist
            sha256sum *.zip > checksums.txt
          )

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cpa-github-copilot/dist/*.zip
            cpa-github-copilot/dist/checksums.txt
          generate_release_notes: true
